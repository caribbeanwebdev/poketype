<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Daño Pokémon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Calculadora de Daño Pokémon</h1>
            <p>Calcula la efectividad de tipos en combate</p>
        </header>

        <div class="calculator">
            <div class="section">
                <h2>Tipo de Ataque</h2>
                <div class="type-selector" id="attackType">
                    <!-- Types will be generated by JS -->
                </div>
            </div>

            <div class="section">
                <h2>Tipos del Pokémon Defensor</h2>
                <div class="defender-types">
                    <div>
                        <label>Tipo 1:</label>
                        <div class="type-selector" id="defenderType1">
                            <!-- Types will be generated by JS -->
                        </div>
                    </div>
                    <div>
                        <label>Tipo 2 (opcional):</label>
                        <div class="type-selector" id="defenderType2">
                            <button class="type-button none-type active" data-type="">Ninguno</button>
                            <!-- Types will be generated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Estadísticas del Ataque</h2>
                <div class="stats-input">
                    <div class="input-group">
                        <label for="attackStat">Ataque/At. Esp.:</label>
                        <input type="number" id="attackStat" value="100" min="1" max="999">
                    </div>
                    <div class="input-group">
                        <label for="defenseStat">Defensa/Def. Esp.:</label>
                        <input type="number" id="defenseStat" value="100" min="1" max="999">
                    </div>
                    <div class="input-group">
                        <label for="basePower">Potencia Base:</label>
                        <input type="number" id="basePower" value="80" min="1" max="999">
                    </div>
                    <div class="input-group">
                        <label for="level">Nivel:</label>
                        <input type="number" id="level" value="50" min="1" max="100">
                    </div>
                </div>

                <div class="modifiers">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="stab">
                            STAB (Same Type Attack Bonus)
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="criticalHit">
                            Golpe Crítico
                        </label>
                    </div>
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateDamage()">Calcular Daño</button>

            <div class="result" id="result" style="display: none;">
                <h2>Resultado</h2>
                <div class="effectiveness">
                    <span class="effectiveness-label">Efectividad:</span>
                    <span class="effectiveness-value" id="effectivenessValue"></span>
                </div>
                <div class="damage-range">
                    <h3>Rango de Daño</h3>
                    <p class="damage-numbers">
                        <span id="minDamage"></span> - <span id="maxDamage"></span>
                    </p>
                    <p class="damage-percent">
                        (<span id="minPercent"></span>% - <span id="maxPercent"></span>%)
                    </p>
                </div>
                <div class="effectiveness-message" id="effectivenessMessage"></div>
            </div>
        </div>

        <footer>
            <p>Basado en las mecánicas de combate de Pokémon (Gen V+)</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
